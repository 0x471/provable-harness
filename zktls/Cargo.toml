# Operator-side zkTLS tooling (MPC-TLS prover proxy), the notary, and a mock
# Anthropic API server for offline tests. Separate workspace: upstream TLSNotary
# needs Rust 1.95 and ring, neither of which belongs in the harness or the guest.
[workspace]

[package]
name = "ph-zktls"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[[bin]]
name = "ph-zktls"
path = "src/main.rs"

[dependencies]
ph-core = { path = "../core" }
tlsn = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", tag = "v0.1.0-beta.1" }
anyhow = "1"
bincode = "1.3"
clap = { version = "4.5", features = ["derive"] }
futures = "0.3"
futures-rustls = "0.25"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
# Dev-only PKI for the mock websites (`ph-zktls dev --web-world`).
rcgen = { version = "0.13", default-features = false, features = ["crypto", "ring", "pem"] }
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa"] }
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
tokio = { version = "1.38", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
debug = 1
