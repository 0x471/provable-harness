[package]
name = "ph-core"
version = "0.1.0"
description = "Sans-IO, deterministic agent harness core shared by the live host and the SP1 guest"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
sha2 = "0.10.9"
ed25519-dalek = "2.2"
# Deterministic script engine for code-mode actions.
#  - no default features: drops ahash/runtime-rng (no getrandom inside the zkVM)
#  - no_time:   no clock access
#  - no_module: no `import` (the default resolver would read the host filesystem)
#  - no_float:  float transcendental functions are libm-dependent; keep scripts integer-only
# float_roundtrip: correctly rounded float parsing (Python `float()` semantics for
# graded amounts; canonical JSON is a fixed point). Found by fuzz/model_reply.
serde_json = { version = "1", features = ["float_roundtrip"] }
# Verify-only, ring-free fork of TLSNotary v0.1.0-beta.1 (see vendor/tlsn/PATCHES.md).
tlsn-attestation = { path = "../vendor/tlsn/attestation" }
tlsn-core = { path = "../vendor/tlsn/core", features = ["mozilla-certs"] }
# ph notary attestation signatures (secp256k1 ECDSA, domain-separated; see zktls.rs).
k256 = { version = "0.13.4", default-features = false, features = ["ecdsa", "std"] }
rhai = { path = "../vendor/rhai", default-features = false, features = [
    "std",
    "no_float",
    "no_time",
    "no_module",
    "no_custom_syntax",
    "only_i64",
] }


[dev-dependencies]
# Re-sign the fixture's attestation header under another signature scheme (tests only).
bcs = "0.1"
k256 = { version = "0.13.4", features = ["ecdsa"] }
