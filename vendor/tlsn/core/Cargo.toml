[package]
name = "tlsn-core"
authors = ["TLSNotary Team"]
description = "Core types for TLSNotary"
keywords = ["tls", "mpc", "2pc", "types"]
categories = ["cryptography"]
license = "MIT OR Apache-2.0"
version = "0.1.0-beta.1"
edition = "2024"

[lints]
workspace = true

[features]
default = []
mozilla-certs = ["dep:webpki-root-certs", "dep:webpki-roots"]
# [ph fork] test fixtures are not vendored; kept so cfg(feature = "fixtures") is known.
fixtures = []

[dependencies]
tlsn-tls-core = { workspace = true, features = ["serde"] }

rangeset = { workspace = true, features = ["serde"] }

const-oid = { workspace = true }
bimap = { version = "0.6", features = ["serde"] }
blake3 = { workspace = true }
opaque-debug = { workspace = true }
rand = { workspace = true }
rand_core = { workspace = true }
rand_chacha = { workspace = true }
rs_merkle = { workspace = true, features = ["serde"] }
serde = { workspace = true }
sha2 = { workspace = true }
spki = { workspace = true }
thiserror = { workspace = true }
tiny-keccak = { workspace = true, features = ["keccak"] }
web-time = { workspace = true }
webpki-roots = { workspace = true, optional = true }
webpki-root-certs = { workspace = true, optional = true }
rustls-webpki = { workspace = true, features = ["ring"] }
rustls-pki-types = { workspace = true }
itybity = { workspace = true }
zeroize = { workspace = true, features = ["zeroize_derive"] }

