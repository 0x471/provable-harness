[package]
name = "tlsn-tls-core"
authors = ["TLSNotary Team"]
description = "Cryptographic operations for the TLSNotary TLS client"
keywords = ["tls", "mpc", "2pc"]
categories = ["cryptography"]
license = "Apache-2.0 OR ISC OR MIT"
version = "0.1.0-beta.1"
edition = "2024"

[lints]
workspace = true

[lib]
name = "tls_core"

[features]
default = ["logging", "tls12", "prf"]
serde = ["dep:serde"]
tls12 = []
handshake = []
ghash = []
logging = ["tracing"]
prf = ["dep:hmac", "dep:sha2"]

[dependencies]
futures = { workspace = true }
hmac = { workspace = true, optional = true }
rand = { workspace = true }
rustls-pemfile = { workspace = true }
serde = { workspace = true, optional = true, features = ["derive"] }
sha2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing = { workspace = true, optional = true }
web-time = { workspace = true }
rustls-webpki = { workspace = true, features = ["alloc"] }
# [ph fork] RustCrypto signature algorithms instead of ring (zkVM-compatible).
ph-webpki-algs = { path = "../../../webpki-algs" }
rustls-pki-types = { workspace = true }
