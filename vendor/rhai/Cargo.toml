[package]
edition = "2021"
rust-version = "1.66.0"
name = "rhai"
version = "1.27.0"
authors = [
    "Jonathan Turner",
    "Lukáš Hozda",
    "Stephen Chung",
    "jhwgh1968",
]
build = false
include = [
    "/src/**/*",
    "/Cargo.toml",
    "/README.md",
    "LICENSE*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "Embedded scripting for Rust"
homepage = "https://rhai.rs"
readme = "README.md"
keywords = [
    "scripting",
    "scripting-engine",
    "scripting-language",
    "embedded",
]
categories = [
    "no-std",
    "embedded",
    "wasm",
    "parser-implementations",
]
license = "MIT OR Apache-2.0"
repository = "https://github.com/rhaiscript/rhai"
resolver = "2"

[package.metadata.docs.rs]
features = [
    "document-features",
    "metadata",
    "serde",
    "internals",
    "decimal",
    "debugging",
    "grain",
]

[features]
bin-features = [
    "decimal",
    "metadata",
    "serde",
    "debugging",
    "rustyline",
]
compact_str = ["dep:compact_str"]
debugging = ["internals"]
decimal = ["rust_decimal"]
default = [
    "std",
    "ahash/runtime-rng",
]
f32_float = []
fuzz = [
    "arbitrary",
    "rust_decimal?/rust-fuzz",
    "serde",
    "grain",
]
grain = []
internals = []
metadata = [
    "serde",
    "serde_json",
    "rhai_codegen/metadata",
]
no_ast = ["no_optimize"]
no_closure = []
no_custom_syntax = []
no_float = []
no_function = ["no_closure"]
no_index = []
no_module = []
no_object = []
no_optimize = []
no_position = []
no_std = [
    "no-std-compat",
    "num-traits/libm",
    "core-error",
    "libm",
    "hashbrown",
    "no_time",
]
no_time = []
only_i32 = []
only_i64 = []
serde = [
    "dep:serde",
    "smallvec/serde",
    "compact_str?/serde",
]
std = [
    "once_cell/std",
    "ahash/std",
    "num-traits/std",
    "smartstring/std",
    "compact_str?/std",
]
sync = [
    "no-std-compat?/compat_sync",
    "rhai_codegen/sync",
]
testing-environ = []
unchecked = []
unicode-xid-ident = ["unicode-xid"]
unstable = []
wasm-bindgen = ["getrandom/wasm_js"]

[lib]
name = "rhai"
path = "src/lib.rs"

[[bin]]
name = "grain-compile"
path = "src/bin/grain-compile.rs"
required-features = ["grain"]

[[bin]]
name = "grain-dump"
path = "src/bin/grain-dump.rs"
required-features = [
    "grain",
    "internals",
]

[[bin]]
name = "rhai-dbg"
path = "src/bin/rhai-dbg.rs"
required-features = [
    "bin-features",
    "debugging",
]

[[bin]]
name = "rhai-repl"
path = "src/bin/rhai-repl.rs"
required-features = ["bin-features"]

[[bin]]
name = "rhai-run"
path = "src/bin/rhai-run.rs"

[dependencies.ahash]
version = "0.8.4"
# (provable-harness patch) no "compile-time-rng": it bakes random keys into
# every build, so the guest ELF and vk were not reproducible. The harness fixes
# Rhai's hashing seed at runtime (script.rs RHAI_HASHING_SEED).
features = []
default-features = false

[dependencies.arbitrary]
version = "1.3.2"
features = ["derive"]
optional = true

[dependencies.bitflags]
version = "2.3.3"
default-features = false

[dependencies.compact_str]
version = ">=0.9, <0.11"
optional = true
default-features = false

[dependencies.core-error]
version = "0.0.0"
features = ["alloc"]
optional = true
default-features = false

[dependencies.document-features]
version = "0.2.0"
optional = true

[dependencies.getrandom]
version = "0.3.4"
optional = true

[dependencies.hashbrown]
version = "0.16.0"
optional = true

[dependencies.libm]
version = "0.2.0"
optional = true
default-features = false

[dependencies.no-std-compat]
version = "0.4.1"
features = ["alloc"]
optional = true
default-features = false

[dependencies.num-traits]
version = "0.2.14"
default-features = false

[dependencies.once_cell]
version = "1.20.1"
features = [
    "race",
    "portable-atomic",
    "alloc",
]
default-features = false

[dependencies.rhai_codegen]
version = "3.3.0"

[dependencies.rust_decimal]
version = "1.24.0"
features = ["maths"]
optional = true
default-features = false

[dependencies.rustyline]
version = "15.0.0"
optional = true

[dependencies.serde]
version = "1.0.136"
features = [
    "derive",
    "alloc",
]
optional = true
default-features = false

[dependencies.serde_json]
version = "1.0.45"
features = ["alloc"]
optional = true
default-features = false

[dependencies.smallvec]
version = "1.7.0"
features = [
    "union",
    "const_new",
    "const_generics",
]
default-features = false

[dependencies.smartstring]
version = "1.0.0"
# (provable-harness patch) vendored with a fix for quadratic appends in the zkVM.
path = "../smartstring"
default-features = false

[dependencies.thin-vec]
version = "0.2.13"
default-features = false

[dependencies.unicode-xid]
version = "0.2.0"
optional = true
default-features = false

[dev-dependencies.rmp-serde]
version = "1.1.1"

[dev-dependencies.serde_json]
version = "1.0.45"
features = ["alloc"]
default-features = false

[target.'cfg(target_family = "wasm")'.dependencies.web-time]
version = "1.1.0"

[profile.release]
lto = "fat"
codegen-units = 1

[lints.rust]
# Set only by a build script that the crates.io package does not ship.
unexpected_cfgs = { level = "allow", check-cfg = ["cfg(atomic_ops_count)"] }
